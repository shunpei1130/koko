name: Koko
options:
  bundleIdPrefix: app.koko
  deploymentTarget:
    iOS: "17.0"
targets:
  Koko:
    type: application
    platform: iOS
    sources:
      - path: Koko
        excludes: [PrivacyInfo.xcprivacy]
      - path: Koko/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_NAME: Koko
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
